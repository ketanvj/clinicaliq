services:
  clinicaliq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    container_name: clinicaliq
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Persist SQLite and ChromaDB data across container restarts
      - clinicaliq_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  clinicaliq_data:
